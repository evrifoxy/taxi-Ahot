<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>about 360 preview</title>
  <style>
    body { margin: 0; background: #111; }
    iframe { display: block; width: 360px; height: 820px; border: 0; }
  </style>
</head>
<body>
  <iframe id="f" name="w360" src="index.html"></iframe>
  <script>
    document.getElementById('f').addEventListener('load', function () {
      var w = this.contentWindow;
      var about = w.document.querySelector('.about');
      w.scrollTo(0, about.getBoundingClientRect().top + w.scrollY - 10);
    });
  </script>
</body>
</html>
