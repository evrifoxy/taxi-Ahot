<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>about responsive preview</title>
  <style>
    body { margin: 0; padding: 12px; background: #111; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
    .box { background: #000; outline: 1px solid #444; overflow: hidden; }
    .box iframe { display: block; border: 0; background: #000; transform-origin: top left; }
    .w360 { width: 360px; height: 1150px; }
    .w360 iframe { width: 360px; height: 1150px; }
    .w768 { width: 768px; height: 1150px; }
    .w768 iframe { width: 768px; height: 1150px; }
    .w1100 { width: 880px; height: 1000px; }
    .w1100 iframe { width: 1100px; height: 1250px; transform: scale(0.8); }
    .w1440 { width: 864px; height: 720px; }
    .w1440 iframe { width: 1440px; height: 1200px; transform: scale(0.6); }
    .w1920 { width: 864px; height: 600px; }
    .w1920 iframe { width: 1920px; height: 1333px; transform: scale(0.45); }
  </style>
</head>
<body>
  <div class="box w360"><iframe name="w360" src="index.html"></iframe></div>
  <div class="box w768"><iframe name="w768" src="index.html"></iframe></div>
  <div class="box w1100"><iframe name="w1100" src="index.html"></iframe></div>
  <div class="box w1440"><iframe name="w1440" src="index.html"></iframe></div>
  <div class="box w1920"><iframe name="w1920" src="index.html"></iframe></div>
</body>
</html>
